<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 10px; color: #f87171; letter-spacing: 1px; }
  .row { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 0; }
  .ok { color: #34d399; }
  .bad { color: #f87171; }
  button { width: 100%; margin-top: 10px; padding: 8px; background: #f87171; color: #0f172a; border: 0; border-radius: 4px; font-weight: 600; cursor: pointer; }
  button:hover { background: #fca5a5; }
  .dim { color: #64748b; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<h1>PANOP BRIDGE</h1>
<div class="row"><span>Server</span><span id="server">—</span></div>
<div class="row"><span>Pending</span><span id="pending">—</span></div>
<div class="row"><span>Last batch</span><span id="last">—</span></div>
<div class="row"><span>Last run</span><span id="when">—</span></div>
<button id="sync">Sync now</button>
<button id="dedup" style="background:#334155;color:#e2e8f0;margin-top:6px;">Dedupe tree</button>
<div class="dim" id="err"></div>
<script src="popup.js"></script>
</body>
</html>
